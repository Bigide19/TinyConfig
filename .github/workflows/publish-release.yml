name: Publish Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - 'TinyConfig/**'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TinyConfig/TinyConfig.csproj && dotnet restore TinyConfig.Tests/TinyConfig.Tests.csproj

      - name: Build
        run: dotnet build TinyConfig/TinyConfig.csproj -c Release --no-restore && dotnet build TinyConfig.Tests/TinyConfig.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test TinyConfig.Tests/TinyConfig.Tests.csproj -c Release --no-restore

      - name: Pack
        run: dotnet pack TinyConfig/TinyConfig.csproj -c Release --no-build -o ./nupkg

      - name: Login to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
