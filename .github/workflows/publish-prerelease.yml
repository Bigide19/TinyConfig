name: Publish Prerelease

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'TinyConfig/**'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TinyConfig/TinyConfig.csproj && dotnet restore TinyConfig.Tests/TinyConfig.Tests.csproj

      - name: Build
        run: dotnet build TinyConfig/TinyConfig.csproj -c Release --no-restore && dotnet build TinyConfig.Tests/TinyConfig.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test TinyConfig.Tests/TinyConfig.Tests.csproj -c Release --no-restore

      - name: Extract version
        id: version
        run: echo "VERSION=$(grep -oP '(?<=<Version>).*(?=</Version>)' TinyConfig/TinyConfig.csproj)" >> $GITHUB_OUTPUT

      # 프리릴리스 번호는 그 버전 안에서만 셉니다. github.run_number 는 워크플로우
      # 실행 횟수라 버전이 올라가도 이어져서, 1.2.0-test.4 다음이 1.3.0-test.5 였습니다.
      - name: Resolve prerelease number
        id: prerelease
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          PUBLISHED=$(curl -sf --retry 3 https://api.nuget.org/v3-flatcontainer/tinyconfig/index.json || echo '{"versions":[]}')
          LAST=$(echo "$PUBLISHED" | jq -r --arg v "$VERSION-test." \
            '[.versions[] | select(startswith($v)) | ltrimstr($v) | tonumber?] | max // 0')
          echo "VERSION=$VERSION-test.$((LAST + 1))" >> $GITHUB_OUTPUT

      - name: Pack (prerelease)
        run: dotnet pack TinyConfig/TinyConfig.csproj -c Release --no-build -o ./nupkg -p:Version=${{ steps.prerelease.outputs.VERSION }}

      - name: Login to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
