name: Publish Prerelease

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - '.github/workflows/**'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TinyConfig/TinyConfig.csproj && dotnet restore TinyConfig.Tests/TinyConfig.Tests.csproj

      - name: Build
        run: dotnet build TinyConfig/TinyConfig.csproj -c Release --no-restore && dotnet build TinyConfig.Tests/TinyConfig.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test TinyConfig.Tests/TinyConfig.Tests.csproj -c Release --no-restore

      - name: Extract version
        id: version
        run: echo "VERSION=$(grep -oP '(?<=<Version>).*(?=</Version>)' TinyConfig/TinyConfig.csproj)" >> $GITHUB_OUTPUT

      - name: Pack (prerelease)
        run: dotnet pack TinyConfig/TinyConfig.csproj -c Release --no-build -o ./nupkg -p:Version=${{ steps.version.outputs.VERSION }}-test.${{ github.run_number }}

      - name: Login to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
